<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thông tin thành viên</title>
</head>

<body>

    <h2 align="center">PHIẾU ĐĂNG KÝ</h2>

    <form action="" method="post">
        <table align="center" cellspacing="6">
            <tr>
                <td align="right">Họ và tên:</td>
                <td>
                    <input type="text" name="hoten" required> (*)
                </td>
            </tr>

            <tr>
                <td align="right">Địa chỉ :</td>
                <td>
                    <input type="text" name="diachi" size="40">
                </td>
            </tr>

            <tr>
                <td align="right">Email :</td>
                <td>
                    <input type="email" name="email" required> (*)
                </td>
            </tr>

            <tr>
                <td align="right">Giới tính :</td>
                <td>
                    <input type="radio" name="gioitinh" id="nam" value="Nam" checked> <label for="nam">Nam</label>
                    <input type="radio" name="gioitinh" id="nu" value="Nữ"> <label for="nu">Nữ</label>
                </td>
            </tr>

            <tr>
                <td align="right">Tuổi :</td>
                <td>
                    <input type="text" name="tuoi" size="5" required> (*)
                </td>
            </tr>

            <tr>
                <td align="right" valign="top">Sở thích :</td>
                <td>
                    <input type="checkbox" name="sothich" id="thethao" value="thethao"> <label for="thethao">Thể thao</label><br>
                    <input type="checkbox" name="sothich" id="vanhoc" value="vanhoc"> <label for="vanhoc">Văn học</label><br>
                    <input type="checkbox" name="sothich" id="cntt" value="cntt"> <label for="cntt">Công nghệ thông tin</label><br>
                    <input type="checkbox" name="sothich" id="lichsu" value="lichsu"> <label for="lichsu">Lịch sử</label><br>
                    <input type="checkbox" name="sothich" id="game" value="game"> <label for="game">Game</label>
                </td>
            </tr>

            <tr>
                <td align="right">Chuyên ngành:</td>
                <td>
                    <select name="chuyennganh">
                        <option value="web" selected>Công nghệ Web</option>
                        <option value="pm">Công nghệ phần mềm</option>
                        <option value="httt">Hệ thống thông tin</option>
                        <option value="mmt">Mạng máy tính</option>
                    </select>
                </td>
            </tr>

            <tr>
                <td align="right">Gởi hình:</td>
                <td>
                    <input type="file" name="hinh">
                </td>
            </tr>

            <tr>
                <td align="right" valign="top">Yêu cầu:</td>
                <td>
                    <textarea name="yeucau" rows="4" cols="35"></textarea>
                </td>
            </tr>

            <tr>
                <td></td>
                <td>
                    <input type="submit" value="Gởi thông tin">
                    <input type="reset" value="Nhập lại">
                </td>
            </tr>
        </table>
    </form>

    <br><br>
    <div align="center">
        <a href="index.html">Quay về trang chủ</a>
    </div>

</body>

</html>
