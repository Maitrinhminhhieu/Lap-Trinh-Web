            border: 2px solid #333;

            border-collapse: collapse;
        }

        .top-menu-table td {
            border-right: 1px solid #777;
            padding: 10px 18px;
            text-align: center;
        }

        .top-menu-table td:last-child {
            border-right: none;
        }

        .top-menu-table a {
            color: #ffffff;
            text-decoration: none;
            font-weight: bold;
            font-size: 14px;
        }

        .top-menu-table a:hover {
            color: #ffeb3b;
        }

        .top-menu-table .active a {
            color: #d1c4e9;
            text-decoration: underline;
        }
